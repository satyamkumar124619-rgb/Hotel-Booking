<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Now</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    .room-card img {
      height: 220px;
      object-fit: cover;
      border-radius: 10px 10px 0 0;
    }
    .room-card {
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease-in-out;
    }
    .room-card:hover {
      transform: scale(1.03);
    }
    .booking-form {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
    nav {
      background-color: #343a40;
      padding: 10px 0;
    }
    .nav__logo {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
    }
    .nav__links {
      list-style: none;
      padding: 0;
    }
    .nav__links li {
      display: inline;
      margin-right: 20px;
    }
    .nav__links a {
      color: #ffffff;
      text-decoration: none;
    }
    .booking__container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
    .booking__container h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .booking__container label {
      font-weight: bold;
    }
    .booking__container input,
    .booking__container select {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav__bar">
      <div class="nav__header">
        <div class="logo nav__logo">
          <div>H</div>
          <span>HOTEL<br />Satyam</span>
        </div>
      </div>
      <ul class="nav__links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="About.html">About</a></li>
        <li><a href="Contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>
  <section class="booking__container">
    <h2>Book Your Room</h2>
    <form class="booking-form">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="room" class="form-label">Room Type</label>
        <select class="form-select" id="room" name="room" required>
          <option value="deluxe">Deluxe - ₹250</option>
          <option value="family">Family - ₹350</option>
          <option value="penthouse">Penthouse - ₹500</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" class="form-control" id="date" name="date" required>
      </div>
      <div class="mt-4 text-center">
        <button type="submit" class="btn btn-success btn-lg">Book Now</button>
      </div>
    </form>
  </section>
</body>
</html>
